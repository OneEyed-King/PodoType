name: Build and push app image

# Builds the self-hosted "app" image (engine + dashboard + Beyla, combined
# — see apps/self-hosted/engine/Dockerfile) and pushes it to this repo's
# own GHCR namespace. Runs on every push to main (tags :latest + the
# commit sha, so a bad build can be rolled back to a known-good sha) and
# on version tags (v1.2.3 -> image tag 1.2.3). linux/amd64 explicitly:
# cheap VPS instances are amd64, and building on GitHub's runners means
# it's the right architecture regardless of what machine you push from.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch: {} # manual rebuild from the Actions tab, no new commit needed

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/podotype-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io under this repo's own GITHUB_TOKEN, no separate PAT needed
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/self-hosted/engine/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
